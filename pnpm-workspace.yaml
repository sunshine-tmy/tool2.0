packages:
  - apps/*
  - packages/*

injectWorkspacePackages: true

onlyBuiltDependencies:
  - electron
  # Required only by electron-builder's transitive install script. The packaged
  # application always builds through the NSIS target.
  - electron-winstaller
  - esbuild
  - sharp
allowBuilds:
  # 13.x ships Node-API prebuilds. pnpm's implicit binding.gyp hook otherwise
  # invokes node-gyp even with gypfile:false, requiring Python/MSVC on clean PCs.
  better-sqlite3: false
  electron: true
  electron-winstaller: true
  esbuild: true
  sharp: true
