packages:
  - apps/*
  - frontend
  - backend
  - packages/*

injectWorkspacePackages: true

onlyBuiltDependencies:
  - better-sqlite3
  - electron
  # Required only by electron-builder's transitive install script. The packaged
  # application always builds through the NSIS target.
  - electron-winstaller
  - esbuild
  - sharp
allowBuilds:
  better-sqlite3: true
  electron: true
  electron-winstaller: true
  esbuild: true
  sharp: true
