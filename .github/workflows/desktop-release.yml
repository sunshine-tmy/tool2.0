name: Windows desktop release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  # Standalone release uses the same tag and GitHub Release; serialize both workflows.
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      WINDOWS_SIGNING_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 }}
      WINDOWS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
      WINDOWS_SIGNING_SUBJECT: ${{ vars.WINDOWS_SIGNING_SUBJECT }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: "11.7.0" }
      - uses: actions/setup-node@v4
        with: { node-version: "24", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Validate release tag and signing material
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".Substring(1)
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Release tag must be v<major>.<minor>.<patch>" }
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_CERTIFICATE_BASE64)) { throw "WINDOWS_SIGNING_CERTIFICATE_BASE64 is required" }
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_CERTIFICATE_PASSWORD)) { throw "WINDOWS_SIGNING_CERTIFICATE_PASSWORD is required" }
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_SUBJECT)) { throw "WINDOWS_SIGNING_SUBJECT repository variable is required" }
          $certificatePath = Join-Path $env:RUNNER_TEMP "ecommerce-toolbox-signing.pfx"
          [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:WINDOWS_SIGNING_CERTIFICATE_BASE64))
          "DESKTOP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "WINDOWS_CERTIFICATE_FILE=$certificatePath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "DESKTOP_RELEASE=1" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "DESKTOP_UPDATE_FEED_URL=${{ github.server_url }}/${{ github.repository }}/releases/latest/download" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Verify desktop sources
        run: pnpm --filter desktop test
      - name: Build signed Squirrel installer and update feed
        run: pnpm desktop:make
      - name: Verify signed update artifacts
        shell: pwsh
        run: |
          $output = "apps/desktop/out/make/squirrel.windows/x64"
          node apps/desktop/scripts/verify-release-artifacts.mjs --directory $output
          ./scripts/verify-windows-signatures.ps1 -Directory "apps/desktop/out/EcommerceToolbox-win32-x64" -ExpectedSubject $env:WINDOWS_SIGNING_SUBJECT
          $package = Get-ChildItem -LiteralPath $output -Filter "EcommerceToolbox-*-full.nupkg" | Select-Object -First 1
          if (-not $package) { throw "Missing Squirrel full package" }
          $expanded = Join-Path $env:RUNNER_TEMP "squirrel-package"
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [System.IO.Compression.ZipFile]::ExtractToDirectory($package.FullName, $expanded)
          ./scripts/verify-windows-signatures.ps1 -Directory $expanded -ExpectedSubject $env:WINDOWS_SIGNING_SUBJECT
      - name: Stage release files and checksums
        shell: pwsh
        run: |
          $source = "apps/desktop/out/make/squirrel.windows/x64"
          $release = "desktop-release"
          New-Item -ItemType Directory -Path $release -Force | Out-Null
          Copy-Item -LiteralPath (Join-Path $source "EcommerceToolboxSetup.exe") -Destination $release
          Copy-Item -LiteralPath (Join-Path $source "RELEASES") -Destination $release
          Get-ChildItem -LiteralPath $source -Filter "EcommerceToolbox-*-full.nupkg" | Copy-Item -Destination $release
          Get-ChildItem -LiteralPath $release -File | ForEach-Object {
            $digest = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$digest  $($_.Name)" | Set-Content -LiteralPath "$($_.FullName).sha256" -Encoding ASCII
          }
      - uses: actions/upload-artifact@v4
        with:
          name: signed-windows-desktop-release
          path: desktop-release/
          if-no-files-found: error

  clean-vm-acceptance:
    needs: package
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      WINDOWS_SIGNING_SUBJECT: ${{ vars.WINDOWS_SIGNING_SUBJECT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "24" }
      - uses: actions/download-artifact@v4
        with:
          name: signed-windows-desktop-release
          path: desktop-release
      - name: Verify downloaded signed artifacts
        shell: pwsh
        run: |
          $release = "desktop-release"
          $version = "${{ github.ref_name }}".Substring(1)
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Release tag must be v<major>.<minor>.<patch>" }
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_SUBJECT)) { throw "WINDOWS_SIGNING_SUBJECT repository variable is required" }
          $checksums = @(Get-ChildItem -LiteralPath $release -Filter "*.sha256")
          if ($checksums.Count -lt 3) { throw "Expected checksums for setup, RELEASES, and full package" }
          $checksums | ForEach-Object {
            $line = (Get-Content -LiteralPath $_.FullName -Raw).Trim()
            if ($line -notmatch '^([0-9a-fA-F]{64})  (.+)$') { throw "Invalid SHA-256 file: $($_.Name)" }
            if ([IO.Path]::GetFileName($Matches[2]) -ne $Matches[2]) { throw "Checksum target must be a release filename: $($_.Name)" }
            $asset = Join-Path $release $Matches[2]
            if (-not (Test-Path -LiteralPath $asset -PathType Leaf)) { throw "Checksum target is missing: $asset" }
            $actual = (Get-FileHash -LiteralPath $asset -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $Matches[1].ToLowerInvariant()) { throw "SHA-256 mismatch: $asset" }
          }
          node apps/desktop/scripts/verify-release-artifacts.mjs --directory $release
          ./scripts/verify-windows-signatures.ps1 -Directory $release -ExpectedSubject $env:WINDOWS_SIGNING_SUBJECT
      - name: Install, launch, health-check, uninstall, and preserve user data
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".Substring(1)
          ./scripts/accept-windows-desktop-install.ps1 -InstallerPath "desktop-release/EcommerceToolboxSetup.exe" -ExpectedVersion $version -ExpectedSubject $env:WINDOWS_SIGNING_SUBJECT

  release:
    needs: [package, clean-vm-acceptance]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: signed-windows-desktop-release
          path: release
      - name: Verify update feed before publishing
        shell: bash
        run: |
          set -euo pipefail
          test -s release/EcommerceToolboxSetup.exe
          test -s release/RELEASES
          test -n "$(find release -maxdepth 1 -name 'EcommerceToolbox-*-full.nupkg' -print -quit)"
          sha256sum -c release/*.sha256
      - name: Create or update signed desktop release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" release/* --clobber
          else
            gh release create "$tag" release/* --verify-tag --generate-notes --title "Ecommerce Toolbox $tag"
          fi
