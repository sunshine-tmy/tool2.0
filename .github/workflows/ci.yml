name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: "11.7.0" }
      - uses: actions/setup-node@v4
        with: { node-version: "24", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm deadcode
      - run: pnpm typecheck

  node-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: "11.7.0" }
      - uses: actions/setup-node@v4
        with: { node-version: "24", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm coverage

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: python -m pip install ".[dev]"
      - run: python -m ruff format --check scripts
      - run: python -m ruff check scripts
      - run: python -m mypy
      - run: python -m pytest

  build-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: "11.7.0" }
      - uses: actions/setup-node@v4
        with: { node-version: "24", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm audit --prod --audit-level high

  distribution-smoke:
    strategy:
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: macos-14
            platform: macos
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: "11.7.0" }
      - uses: actions/setup-node@v4
        with: { node-version: "24", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - shell: pwsh
        run: ./scripts/package-standalone.ps1 -Platform ${{ matrix.platform }} -SkipPythonInstaller
      - shell: pwsh
        run: pnpm --dir .package/standalone/toolbox-${{ matrix.platform }} install --frozen-lockfile
      - shell: pwsh
        run: pnpm --dir .package/standalone/toolbox-${{ matrix.platform }} build
      - shell: pwsh
        run: node .package/standalone/toolbox-${{ matrix.platform }}/scripts/smoke-standalone.mjs .package/standalone/toolbox-${{ matrix.platform }}
