name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: "11.7.0" }
      - uses: actions/setup-node@v4
        with: { node-version: "24", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm deadcode
      - run: pnpm typecheck

  node-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: "11.7.0" }
      - uses: actions/setup-node@v4
        with: { node-version: "24", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Install media tools for Chatterbox tests
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ffmpeg
          ffmpeg -version
      - run: pnpm coverage
      - run: pnpm db:benchmark
      - name: Upload LCOV reports
        uses: actions/upload-artifact@v4
        with:
          name: node-coverage
          path: |
            backend/coverage/lcov.info
            frontend/coverage/lcov.info
            packages/shared/coverage/lcov.info
          if-no-files-found: error

  diff-coverage:
    if: ${{ github.event_name == 'pull_request' }}
    needs: [node-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: node-coverage
          path: .coverage
      - uses: pnpm/action-setup@v4
        with: { version: "11.7.0" }
      - uses: actions/setup-node@v4
        with: { node-version: "24" }
      - name: Check changed-line coverage
        env:
          DIFF_COVERAGE_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          pnpm coverage:diff \
            --base "$DIFF_COVERAGE_BASE" \
            --threshold 90 \
            --lcov .coverage/backend/coverage/lcov.info \
            --lcov .coverage/frontend/coverage/lcov.info \
            --lcov .coverage/packages/shared/coverage/lcov.info

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: "11.7.0" }
      - uses: actions/setup-node@v4
        with: { node-version: "24", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: python -m pip install ".[dev]"
      - run: python -m ruff format --check scripts
      - run: python -m ruff check scripts
      - run: python -m mypy
      - run: python -m pytest
      - run: python scripts/audit-worker-dependencies.py

  build-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: "11.7.0" }
      - uses: actions/setup-node@v4
        with: { node-version: "24", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm audit --prod --audit-level high

  distribution-smoke:
    strategy:
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: macos-14
            platform: macos
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: "11.7.0" }
      - uses: actions/setup-node@v4
        with: { node-version: "24", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - shell: pwsh
        run: ./scripts/package-standalone.ps1 -Platform ${{ matrix.platform }} -SkipPythonInstaller
      - shell: pwsh
        run: |
          $archive = if ("${{ matrix.platform }}" -eq "windows") {
            ".package/standalone/toolbox-windows-x64.zip"
          } else {
            ".package/standalone/toolbox-macos-arm64.tar.gz"
          }
          $checksum = (Get-Content -LiteralPath "$archive.sha256" -Raw).Trim().Split(" ", [StringSplitOptions]::RemoveEmptyEntries)[0]
          $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($checksum -ne $actual) { throw "Standalone archive checksum mismatch" }
          $extractRoot = Join-Path $env:RUNNER_TEMP "toolbox-archive-${{ matrix.platform }}"
          if (Test-Path -LiteralPath $extractRoot) {
            Remove-Item -LiteralPath $extractRoot -Recurse -Force
          }
          New-Item -ItemType Directory -Path $extractRoot -Force | Out-Null
          if ("${{ matrix.platform }}" -eq "windows") {
            Expand-Archive -LiteralPath $archive -DestinationPath $extractRoot -Force
            $standaloneRoot = $extractRoot
          } else {
            & tar -xzf $archive -C $extractRoot
            if ($LASTEXITCODE -ne 0) { throw "Standalone archive extraction failed" }
            $standaloneRoot = Join-Path $extractRoot "toolbox-macos"
          }
          if (-not (Test-Path -LiteralPath (Join-Path $standaloneRoot "package.json"))) {
            throw "Extracted standalone package is missing package.json"
          }
          "STANDALONE_ROOT=$standaloneRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - shell: pwsh
        run: pnpm --dir "$env:STANDALONE_ROOT" install --frozen-lockfile
      - shell: pwsh
        run: pnpm --dir "$env:STANDALONE_ROOT" build
      - shell: pwsh
        run: node "$env:STANDALONE_ROOT/scripts/smoke-standalone.mjs" "$env:STANDALONE_ROOT"

  enterprise-acceptance:
    if: ${{ always() }}
    needs: [static, node-tests, e2e, python, build-and-audit, distribution-smoke, diff-coverage]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      STORAGE_ROOT: ${{ github.workspace }}/.acceptance-storage
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: "11.7.0" }
      - uses: actions/setup-node@v4
        with: { node-version: "24", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Require upstream gates
        shell: bash
        run: |
          set -euo pipefail
          test "${{ needs.static.result }}" = success
          test "${{ needs.node-tests.result }}" = success
          test "${{ needs.e2e.result }}" = success
          test "${{ needs.python.result }}" = success
          test "${{ needs.build-and-audit.result }}" = success
          test "${{ needs.distribution-smoke.result }}" = success
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            test "${{ needs.diff-coverage.result }}" = success
          fi
      - run: git diff --check
      - run: pnpm db:migrate --dry-run
      - run: pnpm db:migrate
      - run: pnpm db:verify
      - run: pnpm db:benchmark
