[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = []

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = [".runtime", ".venv*", "storage", "models"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"scripts/chatterbox-worker.py" = ["E402"]
"scripts/image-ai-worker.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
files = ["scripts"]
exclude = [".*test\\.py$"]
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true

[tool.pytest.ini_options]
testpaths = ["scripts"]
python_files = ["test_*.py"]
addopts = "-q"

[project]
name = "toolbox-workers"
version = "0.1.0"
requires-python = ">=3.11,<3.12"

[project.optional-dependencies]
dev = ["mypy==2.3.1", "pip-audit==2.10.1", "pytest==9.1.1", "ruff==0.16.8"]
